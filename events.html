<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textron India Toastmasters Club | Upcoming Events</title>
  <meta name="description" content="Upcoming events at the Textron India Toastmasters Club." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="nav-brand"><img src="assets/logo/toastmasters-logo.png" alt="Toastmasters Logo" class="logo" onerror="this.remove()" /> Textron India Toastmasters Club</a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="stats.html">Club Stats</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Upcoming Events</h1>
        <p class="tagline">Contests, workshops and special sessions</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="events-grid" id="events-grid">
          <p class="loading-msg">Loading events...</p>
        </div>
      </div>
    </section>
  </main>

  <dialog class="modal modal-lightbox" id="event-lightbox">
    <div class="modal-header">
      <h3 id="event-lightbox-title"></h3>
      <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <img id="event-lightbox-img" src="" alt="" />
    </div>
  </dialog>

  <footer class="site-footer">
    <p>&copy; <span id="footer-year"></span> Textron India Toastmasters Club. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
