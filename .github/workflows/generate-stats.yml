name: Generate stats.json

on:
  push:
    branches: [main]
    paths:
      - "excel-data/stats.xlsm"
      - "scripts/generate_stats.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data/stats.json
        run: python scripts/generate_stats.py

      - name: Commit updated stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "chore: regenerate stats.json [skip ci]"
          git push
