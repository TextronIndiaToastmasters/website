<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textron India Toastmasters Club | Contact Us</title>
  <meta name="description" content="Get in touch with the Textron India Toastmasters Club." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="nav-brand"><img src="assets/logo/toastmasters-logo.png" alt="Toastmasters Logo" class="logo" onerror="this.remove()" /> Textron India Toastmasters Club</a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="stats.html">Club Stats</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="tagline">We'd love to hear from you</p>
      </div>
    </section>

    <section>
      <div class="container">
        <form class="contact-form" id="contact-form" action="https://formspree.io/f/mjybqeak" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone <span class="optional">(optional)</span></label>
              <input type="tel" id="phone" name="phone" />
            </div>
            <div class="form-group">
              <label for="reason">Reason for contact</label>
              <select id="reason" name="reason">
                <option>General Inquiry</option>
                <option>Guest Visit / Attend a Meeting</option>
                <option>Membership Inquiry</option>
                <option>Feedback</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn">Send Message</button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="footer-year"></span> Textron India Toastmasters Club. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
